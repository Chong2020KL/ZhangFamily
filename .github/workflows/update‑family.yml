name: Update Family CSV
on:
  repository_dispatch:
    types: [add-person]
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append new record
        env:
          PASSWORD: ${{ secrets.FAMILY_PASSWORD }}
        run: |
          echo "$EVENT_DATA" > newrow.json
          python3 - <<PY
          import json, csv, os
          event = json.loads(os.environ["EVENT_DATA"])
          if event["pwd"] != os.environ["PASSWORD"]:
              exit(1)
          row = [
              event["no"],
              event["father"],
              event["rank"],
              event["chineseName"],
              event["generation"],
              event["englishName"],
              event["wife"],
              event["sonCount"],
              event["photoLink"],
              event["note"]
          ]
          with open("ZhangFamilyList.csv","a",encoding="utf-8-sig",newline="") as f:
              w=csv.writer(f)
              w.writerow(row)
          PY
      - name: Commit & Push
        run: |
          git config user.name "ZhangFamilyBot"
          git config user.email "bot@example.com"
          git add ZhangFamilyList.csv
          git commit -m "Add new family member"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
